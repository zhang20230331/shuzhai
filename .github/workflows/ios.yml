name: Build iOS IPA (未签名，供巨魔商店安装)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["public/**", "ios/**", ".github/workflows/ios.yml"]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装依赖
        run: set -o pipefail; npm ci 2>&1 | tee npm.log

      - name: 同步 Web 资源与插件
        run: set -o pipefail; npx cap sync ios 2>&1 | tee sync.log

      - name: 编译未签名 IPA
        run: |
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -configuration Release -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            -derivedDataPath build 2>&1 | tee xcodebuild.log
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry shuzhai-unsigned.ipa Payload

      - name: 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: shuzhai-ios-ipa
          path: shuzhai-unsigned.ipa
          retention-days: 30

      - name: 失败时公开日志
        if: failure()
        run: |
          {
            for f in xcodebuild.log sync.log npm.log; do
              [ -f "$f" ] || continue
              echo "===== $f ====="
              grep -iE "error:|Error:|FAILURE|Exception|Exit code|\\*\\* BUILD" "$f" | tail -6
              tail -18 "$f"
            done
          } 2>/dev/null | fold -w 640 | head -10 | sed 's/^/::error::/' || true
