name: Build iOS IPA (未签名，供巨魔商店安装)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["public/**", "ios/**", ".github/workflows/ios.yml"]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: 固定 Xcode 16.2
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 清理 SPM 缓存
        run: |
          defaults write com.apple.dt.Xcode IDEPackageSupportUseBuiltinSCM YES
          rm -rf ~/Library/Caches/org.swift.swiftpm ~/Library/org.swift.swiftpm || true
          rm -rf ios/App/App.xcodeproj/project.xcworkspace/xcshareddata/swiftpm || true

      - name: 安装依赖
        run: set -o pipefail; npm ci 2>&1 | tee npm.log

      - name: 同步 Web 资源与插件
        run: set -o pipefail; npx cap sync ios 2>&1 | tee sync.log

      - name: 插件依赖改用远程 SPM
        run: |
          cd ios/App/CapApp-SPM
          sed -i '' 's|path: "../../../node_modules/@capacitor-community/text-to-speech"|url: "https://github.com/capacitor-community/text-to-speech.git", branch: "main"|' Package.swift
          grep -n "package(" Package.swift

      - name: 解析 SPM 依赖
        run: |
          set -o pipefail
          cd ios/App
          xcodebuild -project App.xcodeproj -resolvePackageDependencies 2>&1 | tee ../../resolve.log

      - name: 编译未签名 IPA
        run: |
          set -o pipefail
          cd ios/App
          xcodebuild -project App.xcodeproj -target App \
            -configuration Release -sdk iphoneos \
            -clonedSourcePackagesDirPath "$GITHUB_WORKSPACE/spm" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            -derivedDataPath "$GITHUB_WORKSPACE/build" 2>&1 | tee ../../xcodebuild.log
          mkdir -p Payload
          cp -r "$GITHUB_WORKSPACE/build/Build/Products/Release-iphoneos/App.app" Payload/
          zip -qry shuzhai-unsigned.ipa Payload

      - name: 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: shuzhai-ios-ipa
          path: shuzhai-unsigned.ipa
          retention-days: 30

      - name: 失败时公开日志
        if: failure()
        run: |
          {
            for f in ios/App/resolve.log ios/App/xcodebuild.log sync.log npm.log; do
              [ -f "$f" ] || continue
              echo "===== $f ====="
              grep -iE "error:|Error:|FAILURE|Exception|Exit code|crash|Resolve" "$f" | tail -6
              tail -18 "$f"
            done
          } 2>/dev/null | fold -w 640 | head -10 | sed 's/^/::error::/' || true
