name: Build iOS IPA (未签名，供巨魔商店安装)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["public/**", "ios/**", ".github/workflows/ios.yml"]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装依赖
        run: set -o pipefail; npm ci 2>&1 | tee npm.log

      - name: 同步 Web 资源与插件
        run: set -o pipefail; npx cap sync ios 2>&1 | tee sync.log

      - name: 插件依赖改用远程 SPM
        run: |
          cd ios/App/CapApp-SPM
          sed -i '' 's|path: "[^"]*node_modules/@capacitor-community/text-to-speech"|url: "https://github.com/capacitor-community/text-to-speech.git", from: "8.0.2"|' Package.swift
          grep -n "text-to-speech" Package.swift

      - name: xcodebuild（未签名设备构建）
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -destination 'generic/platform=iOS' \
            -configuration Debug \
            -allowProvisioningUpdates=NO \
            -derivedDataPath "$GITHUB_WORKSPACE/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee xcodebuild.log
          APP_PATH=$(find "$GITHUB_WORKSPACE/build" -type d -name "App.app" -path "*Debug-iphoneos*" | head -1)
          echo "APP_PATH=$APP_PATH"
          test -n "$APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -qry shuzhai-unsigned.ipa Payload

      - name: 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: shuzhai-ios-ipa
          path: shuzhai-unsigned.ipa
          retention-days: 30

      - name: 失败时公开日志
        if: failure()
        run: |
          {
            echo "=== xcodebuild.log 全量 ==="
            cat xcodebuild.log 2>/dev/null | tr '\n' '|' | fold -w 640
            echo ""
            echo "=== sync.log 尾部 ==="
            tail -10 sync.log 2>/dev/null | tr '\n' '|' | fold -w 640
            echo ""
          } | head -14 | sed 's/^/::error::/' || true
