<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#f7f7f5">
<title>书斋 · 小说听书</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 书架 -->
<div id="shelf" class="page">
  <header class="topbar">
    <h1>书斋 <span class="ver">v2.0</span></h1>
    <div class="topbar-actions">
      <button id="btnStore" class="ghost-btn">名著书城</button>
      <button id="btnImportUrl" class="ghost-btn">链接导入</button>
      <button id="btnUpload" class="primary-btn">＋ 导入 TXT</button>
    </div>
  </header>
  <main id="bookGrid" class="grid"></main>
  <div id="shelfEmpty" class="empty hidden">
    <div class="empty-icon">📖</div>
    <p>书架空空，导入一本 TXT 小说开始吧</p>
    <p class="empty-sub">支持手机文件 / 电脑拖拽 / 链接导入，自动识别 GBK、UTF-8 编码</p>
  </div>
  <input type="file" id="fileInput" accept=".txt,text/plain" multiple hidden>
</div>

<!-- 阅读器 -->
<div id="reader" class="page hidden">
  <main id="viewport">
    <div id="track"></div>
  </main>

  <!-- 常显小标识（呼出菜单时自动隐藏） -->
  <div id="readerMini" class="mini-top"><span id="miniChapter"></span></div>
  <div id="pageMini" class="mini-bottom"><span id="miniPage"></span></div>

  <!-- 顶部菜单（点屏幕中间呼出） -->
  <header id="readerTop" class="reader-top">
    <button id="btnBack" class="icon-btn" title="返回书架">
      <svg viewBox="0 0 24 24" class="svg-ic"><path d="M20 11H7.8l5.6-5.6L12 4l-8 8 8 8 1.4-1.4L7.8 13H20z"/></svg>
    </button>
    <div class="chapter-title" id="chapterTitle"></div>
    <div style="width:38px"></div>
  </header>

  <!-- 底部菜单（点屏幕中间呼出） -->
  <footer id="readerMenu" class="reader-menu">
    <div class="menu-row menu-chapter">
      <button id="btnPrevChapter" class="menu-btn">上一章</button>
      <input type="range" id="pageSlider" min="1" max="1" value="1" step="1">
      <span class="page-text" id="pageText">1/1</span>
      <button id="btnNextChapter" class="menu-btn">下一章</button>
    </div>
    <div class="menu-row menu-actions">
      <button id="btnToc" class="menu-btn">
        <svg viewBox="0 0 24 24" class="svg-ic"><path d="M3 6h18v2H3zM3 11h18v2H3zM3 16h18v2H3z"/></svg><span>目录</span>
      </button>
      <button id="btnListen" class="menu-btn">
        <svg viewBox="0 0 24 24" class="svg-ic"><path d="M12 3a9 9 0 0 0-9 9v6a3 3 0 0 0 3 3h2a1 1 0 0 0 1-1v-7a1 1 0 0 0-1-1H5v-0a7 7 0 0 1 14 0v.1h-3a1 1 0 0 0-1 1v7a1 1 0 0 0 1 1h3a3 3 0 0 0 3-3v-6a9 9 0 0 0-9-9z"/></svg><span>听书</span>
      </button>
      <button id="btnSettings" class="menu-btn">
        <span class="aa">Aa</span><span>设置</span>
      </button>
      <button id="btnNight" class="menu-btn">
        <svg viewBox="0 0 24 24" class="svg-ic"><path d="M12.3 3a9 9 0 1 0 8.7 11.6A7.5 7.5 0 0 1 12.3 3z"/></svg><span>夜间</span>
      </button>
    </div>
  </footer>

  <!-- 听书悬浮球（听书时 / 呼出菜单时显示） -->
  <button id="listenBall" class="listen-ball hidden" title="听书">
    <svg viewBox="0 0 24 24" class="svg-ic"><path d="M12 3a9 9 0 0 0-9 9v6a3 3 0 0 0 3 3h2a1 1 0 0 0 1-1v-7a1 1 0 0 0-1-1H5v-.1a7 7 0 0 1 14 0V12h-3a1 1 0 0 0-1 1v7a1 1 0 0 0 1 1h3a3 3 0 0 0 3-3v-6a9 9 0 0 0-9-9z"/></svg>
  </button>

  <!-- 听书操作面板（大布局，从底部弹出） -->
  <div id="playerSheet" class="sheet hidden">
    <div class="player-head">
      <div class="player-title">
        <div class="player-chapter" id="playerChapter"></div>
        <div class="player-sub" id="playerSub">听书中</div>
      </div>
      <button id="btnClosePlayer" class="pbtn" title="收起面板">
        <svg viewBox="0 0 24 24" class="svg-ic"><path d="M19 6.4 17.6 5 12 10.6 6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12z"/></svg>
      </button>
    </div>
    <div class="player-controls">
      <button id="btnPrevPara" class="pbtn big" title="上一句">
        <svg viewBox="0 0 24 24" class="svg-ic"><path d="M7 6h2.4v12H7zM19 6v12l-9-6z"/></svg>
      </button>
      <button id="btnPlayToggle" class="play-btn big" title="播放/暂停">
        <svg viewBox="0 0 24 24" class="svg-ic" id="icPlay"><path d="M8 5v14l11-7z"/></svg>
        <svg viewBox="0 0 24 24" class="svg-ic hidden" id="icPause"><path d="M6 5h4.2v14H6zM13.8 5H18v14h-4.2z"/></svg>
      </button>
      <button id="btnNextPara" class="pbtn big" title="下一句">
        <svg viewBox="0 0 24 24" class="svg-ic"><path d="M14.6 6H17v12h-2.4zM5 6l9 6-9 6z"/></svg>
      </button>
    </div>
    <div class="player-features">
      <button id="btnVoice" class="feature-btn">音色</button>
      <button id="psRate" class="feature-btn">语速</button>
      <button id="psTimer" class="feature-btn">定时</button>
    </div>
  </div>

  <!-- 音色弹窗 -->
  <div id="voiceMask" class="mask hidden"></div>
  <div id="voiceSheet" class="sheet hidden">
    <div class="sheet-head">朗读音色 <span id="voiceHint" style="font-size:11px;font-weight:400;color:var(--muted)"></span></div>
    <div id="voiceGrid" class="voice-list"></div>
  </div>

  <!-- 语速弹窗 -->
  <div id="rateMask" class="mask hidden"></div>
  <div id="rateSheet" class="sheet hidden">
    <div class="sheet-head">语速</div>
    <div class="rate-big">
      <input type="range" id="rateRange" min="50" max="200" step="10" value="100">
      <div class="rate-scale"><span>0.5x</span><span id="rateLabel" style="font-weight:700;color:var(--accent)">1.0x</span><span>2.0x</span></div>
    </div>
  </div>

  <!-- 定时弹窗 -->
  <div id="timerMask" class="mask hidden"></div>
  <div id="timerSheet" class="sheet hidden">
    <div class="sheet-head">定时关闭</div>
    <div class="sheet-row timer-row">
      <span>按时间</span>
      <div class="timer-chips" id="timerChips">
        <button data-min="0" class="active">不限</button>
        <button data-min="5">5分</button>
        <button data-min="10">10分</button>
        <button data-min="20">20分</button>
        <button data-min="30">30分</button>
        <button data-min="60">60分</button>
      </div>
    </div>
    <div class="sheet-row timer-row">
      <span>按章节</span>
      <div class="timer-chips" id="chapterChips">
        <button data-ch="0" class="active">不限</button>
        <button data-ch="3">3章</button>
        <button data-ch="5">5章</button>
        <button data-ch="10">10章</button>
      </div>
    </div>
  </div>

  <!-- 目录抽屉 -->
  <div id="tocMask" class="mask hidden"></div>
  <aside id="toc" class="drawer hidden">
    <div class="drawer-head">目录 <span id="tocCount"></span></div>
    <div class="toc-search"><input id="tocSearch" type="search" placeholder="搜索章节名称" autocomplete="off"></div>
    <div id="tocList"></div>
  </aside>

  <!-- 设置面板 -->
  <div id="settingsSheet" class="sheet hidden">
    <div class="sheet-row"><span>字号</span>
      <div class="stepper"><button id="fontMinus">A−</button><span id="fontLabel"></span><button id="fontPlus">A＋</button></div>
    </div>
    <div class="sheet-row"><span>行距</span>
      <div class="stepper"><button id="lhMinus">−</button><span id="lhLabel"></span><button id="lhPlus">＋</button></div>
    </div>
    <div class="sheet-row"><span>主题</span>
      <div class="themes">
        <button class="theme-dot" data-theme="white" style="--bg:#ffffff;--fg:#1a1a1a"></button>
        <button class="theme-dot" data-theme="sepia" style="--bg:#f5efdc;--fg:#3b2f1e"></button>
        <button class="theme-dot" data-theme="green" style="--bg:#cde8d2;--fg:#1d3324"></button>
        <button class="theme-dot" data-theme="dark" style="--bg:#121212;--fg:#a8a8a8"></button>
      </div>
    </div>
  </div>

  <div id="flipLoading" class="hidden"><div class="spin"></div></div>
</div>

  <!-- 名著书城 -->
  <div id="storeMask" class="mask hidden"></div>
  <div id="storeSheet" class="sheet hidden">
    <div class="sheet-head">名著书城 <span style="font-size:11px;font-weight:400;color:var(--muted)">公版书 · 已内置 · 离线可读可听</span></div>
    <div id="storeList" class="store-list"></div>
  </div>

  <div id="toast" class="hidden"></div>

  <!-- 打开失败诊断面板：老内核/异常时显示具体原因，不再靠 2 秒提示 -->
  <div id="errPanel" class="hidden">
    <div class="err-card">
      <div class="err-title">打开失败</div>
      <div class="err-msg" id="errMsg"></div>
      <button id="errClose" class="primary-btn">返回书架</button>
    </div>
  </div>
<audio id="audio" preload="auto"></audio>
<script src="local.js"></script>
<script src="app.js"></script>
</body>
</html>
