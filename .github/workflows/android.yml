name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["public/**", "android/**", ".github/workflows/android.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装依赖
        run: set -o pipefail; npm ci 2>&1 | tee npm.log

      - name: 同步 Web 资源与插件
        run: set -o pipefail; npx cap sync android 2>&1 | tee sync.log

      - name: 编译 APK
        run: |
          set -o pipefail
          cd android
          chmod +x gradlew
          echo "sdk.dir=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" > local.properties
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee ../gradle.log

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: shuzhai-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: 失败时公开日志
        if: failure()
        run: |
          {
            for f in android/gradle.log sync.log npm.log; do
              [ -f "$f" ] || continue
              echo "===== $f ====="
              grep -iE "FAILURE|What went wrong|error:|Error:|Exception|Exit code" "$f" | tail -6
              tail -18 "$f"
            done
          } 2>/dev/null | fold -w 640 | head -10 | sed 's/^/::error::/' || true
