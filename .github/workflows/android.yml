name: Build Android APK + 模拟器实测

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["public/**", "android/**", "scripts/**", ".github/workflows/android.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # runner 自带 python3 无 pip（Ubuntu 24.04 externally-managed），用 setup-python 提供可 pip 的环境
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 内置离线语音模型/AAR 下载缓存（约 190MB），按脚本内容变化失效
      - name: 缓存 TTS 资源
        uses: actions/cache@v4
        with:
          path: scripts/.tts-cache
          key: tts-${{ hashFiles('scripts/setup_tts.py', 'scripts/subset_voices.py') }}

      - name: 安装依赖
        run: set -o pipefail; npm ci 2>&1 | tee npm.log

      # 下载 sherpa-onnx AAR + Kokoro int8 模型，音色子集化（103→10）并部署进 android 工程
      - name: 部署离线语音资源
        run: set -o pipefail; python3 scripts/setup_tts.py 2>&1 | tee tts-setup.log

      - name: 同步 Web 资源与插件
        run: set -o pipefail; npx cap sync android 2>&1 | tee sync.log

      - name: 编译 APK（真机双 ABI）
        run: |
          set -o pipefail
          cd android
          chmod +x gradlew
          echo "sdk.dir=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" > local.properties
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee ../gradle.log

      - name: 编译模拟器变体 APK（追加 x86_64）
        run: |
          set -o pipefail
          cd android
          ./gradlew assembleDebug -PabiExtra=x86_64 --no-daemon 2>&1 | tee ../gradle-x86.log

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: shuzhai-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: 失败时公开日志
        if: failure()
        run: |
          {
            for f in android/gradle.log android/gradle-x86.log sync.log npm.log tts-setup.log; do
              [ -f "$f" ] || continue
              echo "===== $f ====="
              grep -iE "FAILURE|What went wrong|error:|Error:|Exception|Exit code" "$f" | tail -6
              tail -18 "$f"
            done
          } 2>/dev/null | fold -w 640 | head -10 | sed 's/^/::error::/' || true

  emulator-test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # runner 自带 python3 无 pip（Ubuntu 24.04 externally-managed），用 setup-python 提供可 pip 的环境
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 缓存 TTS 资源
        uses: actions/cache@v4
        with:
          path: scripts/.tts-cache
          key: tts-${{ hashFiles('scripts/setup_tts.py', 'scripts/subset_voices.py') }}

      - name: 安装依赖并部署语音资源
        run: |
          set -o pipefail
          npm ci
          python3 scripts/setup_tts.py
          npx cap sync android

      - name: 编译模拟器变体 APK
        run: |
          cd android
          chmod +x gradlew
          echo "sdk.dir=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" > local.properties
          ./gradlew assembleDebug -PabiExtra=x86_64 --no-daemon

      - name: KVM 权限
        run: echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          && sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: AVD 缓存
        id: avd-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api34-x86_64-pixel6

      - name: 创建 AVD（无缓存时）
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back none
          disable-animations: true
          script: echo "预创建 AVD 完成"

      - name: 启动模拟器并实测应用
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            set -x
            mkdir -p shots
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            # 预授权通知权限，避免启动弹窗遮挡
            adb shell pm grant com.shuzhai.reader android.permission.POST_NOTIFICATIONS 2>/dev/null || true
            adb shell am start -n com.shuzhai.reader/.MainActivity
            sleep 14
            adb exec-out screencap -p > shots/01-launch.png
            # CDP 驱动 WebView 走完 书城导入→阅读→听书（不依赖屏幕坐标）
            PID=$(adb shell pidof com.shuzhai.reader | tr -d '\r')
            adb forward tcp:9222 localabstract:webview_devtools_remote_$PID
            pip install --quiet websocket-client
            python3 .github/scripts/cdp_smoke.py shots
            # 二次安装验证覆盖安装（同签名新包直接覆盖，无需卸载）
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell dumpsys package com.shuzhai.reader | grep -E "versionCode|versionName"
            adb logcat -d | grep -aE "FATAL EXCEPTION|SIGABRT" | head -5 || true

      - name: 上传实测截图
        uses: actions/upload-artifact@v4
        with:
          name: shuzhai-android-emulator-screens
          path: shots/*.png
          retention-days: 30
